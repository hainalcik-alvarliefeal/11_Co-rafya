<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11. Sınıf Coğrafya Portalı</title>
    <style>
        :root {
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --primary-green: #2d5a27;
            --light-green: #e8f0e6;
            --earth-brown: #8c6d46;
            --text-color: #2b332a;
            --border-color: #c2d0be;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(45, 90, 39, 0.08);
            border-top: 6px solid var(--primary-green);
        }
        h2 { color: var(--primary-green); text-align: center; margin-bottom: 5px; }
        .subtitle { color: var(--earth-brown); text-align: center; margin-bottom: 30px; font-weight: 600; font-size: 14px; }
        .menu-list { display: flex; flex-direction: column; gap: 15px; }
        .menu-item {
            background-color: var(--light-green);
            border: 1px solid var(--border-color);
            padding: 18px 22px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--primary-green);
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .menu-item:hover {
            background-color: var(--primary-green);
            color: white;
            transform: translateY(-2px);
        }
        .item-content { display: flex; align-items: center; gap: 15px; }
        .item-number {
            background-color: var(--earth-brown);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>11. Sınıf Coğrafya Portalı</h2>
    <div class="subtitle">Ders Uygulamaları, Ödev ve Etkinlikler</div>

    <div class="menu-list">
        <!-- 1. Ödev -->
        <a href="etkinlik1.html" class="menu-item">
            <div class="item-content">
                <div class="item-number">1</div>
                <span>Mekânsal Analiz Ödev Matrisi</span>
            </div>
            <span>&rarr;</span>
        </a>

        <!-- 2. Etkinlik -->
        <a href="etkinlik.html" class="menu-item">
            <div class="item-content">
                <div class="item-number">2</div>
                <span>Coğrafyanın Doğası: Mekânsal Sorunlar ve Çözümleri</span>
            </div>
            <span>&rarr;</span>
        </a>
    </div>
</div>

</body>
</html>
